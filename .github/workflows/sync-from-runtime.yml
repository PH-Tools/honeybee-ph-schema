name: Sync From Runtime

on:
  repository_dispatch:
    types: [runtime-release]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Resolve runtime payload
        id: payload
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          payload = {}
          if event_path.exists():
            data = json.loads(event_path.read_text(encoding="utf-8"))
            payload = data.get("client_payload", {})

          runtime_version = payload.get("runtime_version", "unknown")
          runtime_tag = payload.get("runtime_tag", "unknown")
          runtime_sha = payload.get("runtime_sha", "unknown")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"runtime_version={runtime_version}\\n")
            out.write(f"runtime_tag={runtime_tag}\\n")
            out.write(f"runtime_sha={runtime_sha}\\n")
          PY

      - name: Rebuild schema artifacts
        run: python scripts/build_schemas.py

      - name: Create sync pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/runtime-sync-${{ github.run_id }}
          title: "chore: sync schema artifacts from runtime ${{ steps.payload.outputs.runtime_version }}"
          commit-message: "chore: sync schema artifacts from runtime"
          body: |
            Automated schema sync run.

            Runtime version: `${{ steps.payload.outputs.runtime_version }}`
            Runtime tag: `${{ steps.payload.outputs.runtime_tag }}`
            Runtime sha: `${{ steps.payload.outputs.runtime_sha }}`

            Compatibility status: pending classification.
          labels: |
            automation
            schema-sync

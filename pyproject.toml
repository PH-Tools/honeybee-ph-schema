[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "honeybee-ph-schema"
version = "0.1.0"
description = "Schema contracts for Honeybee-PH HBJSON extensions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [{ name = "PH-Tools" }]
dependencies = [
  "pydantic>=2.8.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["honeybee_ph_schema"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100
